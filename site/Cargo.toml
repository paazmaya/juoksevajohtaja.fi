[package]
name = "juoksevajohtaja-site"
version = "0.1.0"
description = "Juokseva Johtaja podcast site, a Leptos single-page application"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "juoksevajohtaja-site"

[features]
# Native builds (tests, pre-renderer) render HTML on the server side.
# Trunk builds the browser bundle with `--no-default-features --features csr`.
default = ["ssr"]
csr = ["leptos/csr"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]

[[bin]]
name = "juoksevajohtaja-site"
path = "src/main.rs"

[[bin]]
name = "prerender"
path = "src/bin/prerender.rs"
required-features = ["ssr"]

[dependencies]
juoksevajohtaja-content = { path = "../crates/content" }
leptos = "0.8.23"
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "Event",
  "HtmlAudioElement",
  "HtmlCollection",
  "HtmlIFrameElement",
  "HtmlMediaElement",
  "NodeList",
  "Storage",
  "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[dev-dependencies]
any_spawner = { version = "0.3", features = ["futures-executor"] }
futures = "0.3"

[build-dependencies]
juoksevajohtaja-content = { path = "../crates/content", features = ["parse"] }
