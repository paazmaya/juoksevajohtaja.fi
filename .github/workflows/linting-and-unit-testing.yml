name: Node.js CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "!content/**"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "!content/**"
      - "LICENSE*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js v24
        uses: chainguard-actions/actions-setup-node@0fc7fd914070e07cca22606e4cab3cfeaf43711d # v7.1.0
        with:
          node-version: "24.x"

      - name: Set up Rust
        uses: chainguard-actions/dtolnay-rust-toolchain@7b7b95556805186e9eb5b44efdafea3a47dbaa56 # v1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, llvm-tools-preview

      - name: Install Trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xzf- -C /usr/local/bin

      - name: Install cargo-llvm-cov
        uses: chainguard-actions/taiki-e-install-action@4ad084f9b26e8738df9593d5b3c742885c5bb985 # v2.90.5
        with:
          tool: cargo-llvm-cov

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.com

      - name: Install Playwright browsers
        run: npx --registry=https://registry.npmjs.com playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      # Unit tests with the 95 % line coverage gate, then build (site, game, pre-render) and end-to-end tests.
      - name: Test
        run: npm test
